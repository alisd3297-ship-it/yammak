name: Build iOS - Lababak

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Create iOS project
        run: |
          rm -rf ios
          bunx cap add ios

      - name: Sync Capacitor
        run: bunx cap sync ios

      - name: Build iOS archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Lababak.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Zip archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
          "$RUNNER_TEMP/Lababak.xcarchive" \
          "$RUNNER_TEMP/Lababak-iOS-Archive.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Lababak-iOS-Archive
          path: ${{ runner.temp }}/Lababak-iOS-Archive.zip
