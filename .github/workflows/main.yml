name: Build Android (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (اتركه فارغاً لاستخدام android-config/version.json)"
        required: false
        default: ""
      versionName:
        description: "versionName (اتركه فارغاً لاستخدام android-config/version.json)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ inputs.versionCode }}
      ANDROID_VERSION_NAME: ${{ inputs.versionName }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Create Android project
        run: |
          rm -rf android
          bunx cap add android

      - name: Restore google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cp android-config/google-services.json android/app/google-services.json
          fi

      - name: Verify Firebase config
        run: node scripts/verify-google-services.mjs android/app/google-services.json

      - name: Restore release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/lubabak-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=lubabak-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Generate app icons and splash
        run: bunx capacitor-assets generate --android || true

      - name: Apply Android customizations
        run: node scripts/android-customize.mjs

      - name: Apply version code / name
        run: node scripts/android-version.mjs

      - name: Verify applicationId continuity
        run: grep -q 'applicationId "iq.lababak.app"' android/app/build.gradle

      - name: Apply release signing config
        run: node scripts/android-signing.mjs

      - name: Require release keystore
        run: |
          if [ ! -f android/keystore.properties ]; then
            echo "::error::مفتاح التوقيع غير متوفر — لا يمكن إنتاج AAB صالح للتحديث على Google Play."
            exit 1
          fi

      - name: Copy web app to Android
        run: bunx cap copy android

      - name: Sync Android
        run: bunx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lubabak-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lubabak-AAB
          path: android/app/build/outputs/bundle/release/app-release*.aab
