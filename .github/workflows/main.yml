name: Build Android (APK + AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Create Android project
        run: |
          rm -rf android
          bunx cap add android

      - name: Restore google-services.json (optional)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Restore release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/lubabak-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=lubabak-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Generate app icons and splash
        run: bunx capacitor-assets generate --android || true

      - name: Apply Android customizations (permissions, name, FCM)
        run: node scripts/android-customize.mjs

      - name: Apply release signing config
        run: node scripts/android-signing.mjs

      - name: Copy web app to Android
        run: bunx cap copy android

      - name: Sync Android
        run: bunx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lubabak-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lubabak-AAB
          path: android/app/build/outputs/bundle/release/app-release*.aab
