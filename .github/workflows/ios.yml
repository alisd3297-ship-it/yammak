name: Build iOS - Lababak

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Repair sharp for Capacitor Assets (macOS ARM64)
        run: |
          bun pm untrusted || true
          npm install \
            --prefix node_modules/@capacitor/assets \
            --ignore-scripts=false \
            --foreground-scripts \
            --os=darwin \
            --cpu=arm64 \
            sharp@0.32.6
          node -e "require('./node_modules/@capacitor/assets/node_modules/sharp'); console.log('capacitor-assets sharp OK')"

      - name: Build web app
        run: bun run build

      - name: Create iOS project
        run: |
          rm -rf ios
          bunx cap add ios

      - name: Generate app icon & splash
        run: bunx capacitor-assets generate --ios

      - name: Customize iOS project
        run: node scripts/ios-customize.mjs

      - name: Sync Capacitor
        run: bunx cap sync ios

      - name: Build iOS archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Lababak.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Zip archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
          "$RUNNER_TEMP/Lababak.xcarchive" \
          "$RUNNER_TEMP/Lababak-iOS-Archive.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Lababak-iOS-Archive
          path: ${{ runner.temp }}/Lababak-iOS-Archive.zip
