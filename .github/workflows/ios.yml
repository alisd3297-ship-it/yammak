- name: Repair sharp for Capacitor Assets (macOS ARM64)
  run: |
    bun pm untrusted || true
    npm install --ignore-scripts=false --foreground-scripts --prefix node_modules/@capacitor/assets/node_modules/sharp --os=darwin --cpu=arm64 sharp@0.32.6
    node -e "require('./node_modules/@capacitor/assets/node_modules/sharp'); console.log('capacitor-assets sharp OK')"
